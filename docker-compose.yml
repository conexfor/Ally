# Entorno local: PostgreSQL + API.  `docker compose up -d`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ally
      POSTGRES_PASSWORD: ally-dev
      POSTGRES_DB: ally
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ally"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://ally:ally-dev@db:5432/ally?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      SMTP_HOST: ${SMTP_HOST:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
